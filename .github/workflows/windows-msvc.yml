name: Windows MSVC

on:
  pull_request:
  push:
    branches:
      - dev
      - windows-msvc-rtt
  workflow_dispatch:

jobs:
  build:
    name: RTT win32 target
    runs-on: windows-2022

    env:
      OROCOS_TARGET: win32
      CI_VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      INSTALL_PREFIX: ${{ github.workspace }}\install-msvc
      BUILD_DIR: ${{ github.workspace }}\build-msvc

    steps:
      - name: Check out RTT
        uses: actions/checkout@v6

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check out farbot
        uses: actions/checkout@v6
        with:
          repository: liufang-robot/farbot
          ref: 09fd406eef4778511e85b569e3e75cad3d5cf608
          path: farbot

      - name: Check out rtlog-cpp
        uses: actions/checkout@v6
        with:
          repository: liufang-robot/rtlog-cpp
          ref: 5842ca36c69ad4ba34321eda80891c832298f161
          path: rtlog-cpp

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:CI_VCPKG_ROOT"
          & "$env:CI_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:CI_VCPKG_ROOT\vcpkg.exe" install `
            boost-assign:x64-windows `
            boost-filesystem:x64-windows `
            boost-functional:x64-windows `
            boost-serialization:x64-windows `
            boost-thread:x64-windows `
            boost-uuid:x64-windows `
            boost-graph:x64-windows `
            boost-program-options:x64-windows `
            boost-test:x64-windows `
            libxml2:x64-windows

      - name: Configure farbot
        shell: pwsh
        run: |
          cmake -S farbot -B build-farbot -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$env:INSTALL_PREFIX"

      - name: Install farbot
        shell: pwsh
        run: cmake --build build-farbot --config Release --target INSTALL -- /m:4

      - name: Configure rtlog-cpp
        shell: pwsh
        run: |
          cmake -S rtlog-cpp -B build-rtlog -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:INSTALL_PREFIX" `
            -DCMAKE_INSTALL_PREFIX="$env:INSTALL_PREFIX" `
            -DRTLOG_BUILD_TESTS=OFF

      - name: Install rtlog-cpp
        shell: pwsh
        run: cmake --build build-rtlog --config Release --target INSTALL -- /m:4

      - name: Configure RTT
        shell: pwsh
        run: |
          cmake -S . -B "$env:BUILD_DIR" -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:CI_VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:INSTALL_PREFIX" `
            -DCMAKE_INSTALL_PREFIX="$env:INSTALL_PREFIX" `
            -DOROCOS_TARGET=win32 `
            -DENABLE_CORBA=OFF `
            -DENABLE_TESTS=OFF `
            -DBUILD_TESTING=OFF `
            -DBUILD_DOCS=OFF `
            -DOROBLD_FORCE_TINY_DEMARSHALLER=ON `
            -DPLUGINS_ENABLE=ON `
            -DPLUGINS_ENABLE_MARSHALLING=ON `
            -DPLUGINS_ENABLE_TYPEKIT=ON `
            -DPLUGINS_ENABLE_SCRIPTING=ON `
            -DORO_OS_USE_BOOST_THREAD=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build RTT scripting
        shell: pwsh
        run: cmake --build "$env:BUILD_DIR" --config Release --target rtt-scripting-win32_plugin -- /m:4

      - name: Install RTT
        shell: pwsh
        run: cmake --build "$env:BUILD_DIR" --config Release --target INSTALL -- /m:4

      - name: Verify installed artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            "$env:INSTALL_PREFIX\bin\orocos-rtt-win32.dll",
            "$env:INSTALL_PREFIX\lib\orocos\win32\plugins\rtt-scripting-win32.dll",
            "$env:INSTALL_PREFIX\lib\orocos\win32\types\rtt-typekit-win32.dll"
          )
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Missing expected artifact: $artifact"
            }
          }
